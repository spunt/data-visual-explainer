[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-visual-explainer"
version = "0.1.0"
description = "Explain one metric at four depths, from a plain-language gist to a reproducible spec, from a single YAML card."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "jinja2>=3.1",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
examples = ["pandas>=2", "numpy>=1.26", "statsmodels>=0.14"]
shots = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
mcard = "mcard.cli:main"

# mcard reads schema/ from the checkout, so install editable: pip install -e ".[dev]"
[tool.setuptools]
packages = ["mcard"]

[tool.setuptools.package-data]
mcard = ["templates/*.j2", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["eval", ".*", "site", "private", "examples"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"
